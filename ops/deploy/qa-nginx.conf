        limit_req_status 429;
        proxy_pass http://fom_mobile_api;
        include /etc/nginx/fom-mobile-proxy-params.conf;
    }

    include /etc/nginx/fom-mobile-system-locations.conf;

    location = /api/v1/mobile/auth/refresh {
        limit_except POST { deny all; }
        limit_req zone=fom_mobile_refresh burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://fom_mobile_api;
        include /etc/nginx/fom-mobile-proxy-params.conf;
    }

    location = /api/v1/mobile/auth/logout {
        limit_except POST { deny all; }
        limit_req zone=fom_mobile_session_v2 burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://fom_mobile_api;
        include /etc/nginx/fom-mobile-proxy-params.conf;
    }

    location = /api/v1/mobile/auth/me {
        limit_except GET { deny all; }
        limit_req zone=fom_mobile_session_v2 burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://fom_mobile_api;
        include /etc/nginx/fom-mobile-proxy-params.conf;
    }

    location = /api/v1/mobile/auth/password/change {
        limit_except POST { deny all; }
        limit_req zone=fom_mobile_session_v2 burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://fom_mobile_api;
        include /etc/nginx/fom-mobile-proxy-params.conf;
    }

    # Ambas rutas públicas de recuperación comparten el límite estricto del
    # login. La entrega permanece desactivada hasta instalar un adaptador por
    # un gate operacional independiente.
    location = /api/v1/mobile/auth/password-recovery/request {
        limit_except POST { deny all; }
        limit_req zone=fom_mobile_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://fom_mobile_api;
        include /etc/nginx/fom-mobile-proxy-params.conf;
    }

    location = /api/v1/mobile/auth/password-recovery/confirm {
        limit_except POST { deny all; }
        limit_req zone=fom_mobile_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://fom_mobile_api;
        include /etc/nginx/fom-mobile-proxy-params.conf;
    }

    location = /api/v1/mobile/auth/email-change/confirm {
        limit_except POST { deny all; }
        limit_req zone=fom_mobile_session_v2 burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://fom_mobile_api;
        include /etc/nginx/fom-mobile-proxy-params.conf;
    }

    include /etc/nginx/fom-mobile-vehicles-locations.conf;

    # FOM React website: static production build, independent browser sessions.
    root /home/fomadmin/fom-web-publication-20260921/dist;
    index index.html;

    location = /fom-api/health { rewrite ^ /health last; }
    location = /fom-api/version { rewrite ^ /version last; }
    location ^~ /fom-api/api/v1/console/ {
        rewrite ^/fom-api(/api/v1/console/.*)$ $1 last;
    }
    location ^~ /fom-api/ { return 404; }
    location /api/ { return 404; }
    location /gps-console-internal { return 404; }
    location ~ /\. { return 404; }
    location = /_redirects { return 404; }
    location /assets/ { try_files $uri =404; }
    location /intro/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }

    # BEGIN fom-console-prod (issue-185)
    location = /api/v1/console/auth/login {
        limit_req zone=fom_console_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://fom_console_prod_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location ^~ /api/v1/console/ {
        limit_req zone=fom_console_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://fom_console_prod_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
