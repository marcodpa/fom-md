<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Índice de manejo · Referencia de la app</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0a0d12;color:#f3f5f8;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}main{width:600px;padding:32px;margin:auto}header{margin-bottom:24px}header small{color:#abb3bf;font-size:12px;letter-spacing:1.3px}h1{font-size:26px;line-height:34px;letter-spacing:-.4px;margin:8px 0}header p,footer{font-size:13px;line-height:20px;color:#abb3bf;margin:0}section{display:flex;align-items:center;gap:16px;padding:16px;background:#141a22;border:.5px solid #262e39;border-radius:16px;box-shadow:0 2px 10px #0006;margin-bottom:16px}.ring{flex:none;width:112px;height:112px;position:relative}.number{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.number strong{font-size:32px;line-height:40px;letter-spacing:-.4px;color:var(--tone);font-weight:700}.number span{color:#69727e;font-size:14px;line-height:20px;font-weight:500}.detail{flex:1;display:flex;flex-direction:column;gap:4px}.overline{color:#69727e;font-size:12px;line-height:16px;font-weight:600;letter-spacing:.8px;text-transform:uppercase}.status{font-size:20px;line-height:28px;font-weight:600;color:var(--tone)}.caption{font-size:14px;line-height:20px;font-weight:500;color:#69727e}.events{display:grid;gap:2px}.event{display:flex;justify-content:space-between;gap:8px;font-size:14px;line-height:20px;font-weight:500}.event span:first-child{color:#abb3bf}.event span:last-child{font-variant-numeric:tabular-nums}footer{padding-top:4px}svg{display:block}
</style></head><body><main><header><small>FOM · MI PERFIL</small><h1>Índice de manejo seguro</h1><p>Referencia reconstruida desde el componente de la app.<br>Los tres estados, con puntuaciones y eventos de ejemplo.</p></header><div id="cards"></div><footer>Se conserva el diseño de Card + ScoreRing de la copia local de la app.</footer></main><script>
const states=[{score:94,color:'#3DD68C',label:'Manejo seguro',events:['0.2','0.1','0.3']},{score:72,color:'#F5C242',label:'Puedes mejorar',events:['2.4','1.6','1.1']},{score:41,color:'#FF6369',label:'Requiere atención',events:['6.8','4.2','3.5']}];
const labels=['Excesos de velocidad','Frenadas bruscas','Aceleraciones bruscas'];
document.getElementById('cards').innerHTML=states.map(s=>`<section style="--tone:${s.color}" aria-label="${s.label}, ${s.score} de 100"><div class="ring"><svg viewBox="0 0 112 112" width="112" height="112" aria-hidden="true"><circle cx="56" cy="56" r="50" stroke="#0f141b" stroke-width="12" fill="none"/><circle cx="56" cy="56" r="50" stroke="${s.color}" stroke-width="12" stroke-linecap="round" fill="none" stroke-dasharray="${Math.PI*100}" stroke-dashoffset="${Math.PI*100*(1-s.score/100)}" transform="rotate(-90 56 56)"/></svg><div class="number"><strong>${s.score}</strong><span>/ 100</span></div></div><div class="detail"><div class="overline">Índice de manejo seguro</div><div class="status">${s.label}</div><div class="caption">Por cada 100 km</div><div class="events">${labels.map((label,i)=>`<div class="event"><span>${label}</span><span>${s.events[i]}</span></div>`).join('')}</div></div></section>`).join('');
</script></body></html>
