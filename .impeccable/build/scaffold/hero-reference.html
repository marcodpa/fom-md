<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: 01.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+Hei+HK:wght@700&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#111721}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1672px">
  <figure class="r-scene region plate" data-region="scene"><img src="../../../src/assets/marketing/home-v7/01.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-navigation region chrome" data-region="navigation"><!-- Dark grouped navigation bar with blue active underline --></div>
  <div class="r-kicker region text" data-region="kicker"><!-- Flotas que mantienen el mundo en movimiento --><p style="font-size:var(--r-kicker-font);line-height:1.05;margin:0">kicker</p></div>
  <div class="r-headline region text" data-region="headline"><!-- Tu flota conectada. Tu operación, bajo control. --><p style="font-size:var(--r-headline-font);font-family:var(--r-headline-family),sans-serif;font-weight:var(--r-headline-weight);line-height:1.05;margin:0">headline</p></div>
  <div class="r-body region text" data-region="body"><!-- La oficina y la carretera, en una misma plataforma. --><p style="font-size:var(--r-body-font);line-height:1.05;margin:0">body</p></div>
  <div class="r-cta region control" data-region="cta"><!-- Solicitar una demostración, blue button with arrow: rebuild the control's chrome from the crop (comp-spec.mjs --crop cta); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-demo region text" data-region="demo"><!-- Datos de demostración --><p style="font-size:var(--r-demo-font);line-height:1.05;margin:0">demo</p></div>
</main>
</body>
</html>
