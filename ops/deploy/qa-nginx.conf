pid /home/fomadmin/fom-web-publication-20260921/qa-nginx.pid;
error_log stderr;
events {}
http { include /etc/nginx/mime.types; access_log off; client_body_temp_path /home/fomadmin/fom-web-publication-20260921/qa-body; proxy_temp_path /home/fomadmin/fom-web-publication-20260921/qa-proxy; fastcgi_temp_path /home/fomadmin/fom-web-publication-20260921/qa-fastcgi; uwsgi_temp_path /home/fomadmin/fom-web-publication-20260921/qa-uwsgi; scgi_temp_path /home/fomadmin/fom-web-publication-20260921/qa-scgi;
# BEGIN fom-console-prod (issue-185)
upstream fom_console_prod_api {
    server 127.0.0.1:3000;
    keepalive 8;
}
limit_req_zone $binary_remote_addr zone=fom_console_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=fom_console_api:10m rate=120r/m;
# END fom-console-prod (issue-185)

log_format fom_mobile '$remote_addr - $request_method $uri $server_protocol '
                      '$status $body_bytes_sent $request_time';

# Las rutas Bearer comparten IP detrás de NAT. La clave vive solo en memoria de
# Nginx y nunca forma parte del access log. Sin Bearer se conserva un límite
# por IP para que una petición anónima no cree una clave vacía ilimitada.
map $http_authorization $fom_mobile_session_key {
    default $http_authorization;
    "" "anonymous:$binary_remote_addr";
}

limit_conn_zone $binary_remote_addr zone=fom_mobile_connections:10m;
limit_req_zone $binary_remote_addr zone=fom_mobile_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=fom_mobile_refresh:10m rate=10r/m;
# Nginx no permite cambiar la clave de una zona compartida durante reload.
# Versionar el nombre hace compatible la transición desde el límite legado por IP.
limit_req_zone $fom_mobile_session_key zone=fom_mobile_session_v2:10m rate=60r/m;

upstream fom_mobile_api {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 127.0.0.1:18080;
    server_name 15.204.105.201;
    server_tokens off;

    access_log off;
    error_log /home/fomadmin/fom-web-publication-20260921/qa-error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/fom/acme;
        default_type text/plain;
        try_files $uri =404;
        limit_except GET { deny all; }
    }

    location / {
        return 308 https://15.204.105.201$request_uri;
    }
}

server {
    listen 127.0.0.1:18443;
    server_name 15.204.105.201;
    server_tokens off;


    client_max_body_size 16k;
    client_body_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 10s;
    limit_conn fom_mobile_connections 20;

    access_log /home/fomadmin/fom-web-publication-20260921/qa-access.log fom_mobile;
    error_log /home/fomadmin/fom-web-publication-20260921/qa-error.log warn;

    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /api/v1/mobile/auth/login {
        limit_except POST { deny all; }
