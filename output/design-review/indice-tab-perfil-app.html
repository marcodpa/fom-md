<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Tarjeta del índice · Pestaña Perfil</title><style>
*{box-sizing:border-box}body{margin:0;background:#0a0d12;color:#f3f5f8;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}main{width:1216px;padding:32px}header{margin-bottom:26px}small{font-size:12px;letter-spacing:1px;color:#abb3bf}h1{font-size:28px;line-height:36px;margin:6px 0 8px;letter-spacing:-.4px}p,footer{font-size:14px;line-height:20px;color:#abb3bf;margin:0}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#141a22;border:.5px solid #262e39;border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:16px;overflow:hidden;position:relative}.card.warn{border-color:var(--tone);background:linear-gradient(135deg,var(--halo) 0%,#141a22 50%)}.hero{display:flex;align-items:center;gap:16px}.ring{width:112px;height:112px;flex:none;position:relative}.number{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column}.number strong{font-size:32px;line-height:40px;font-weight:700;letter-spacing:-.4px;color:var(--tone)}.number span{font-size:14px;line-height:20px;color:#69727e;font-weight:500}.verdict{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}.eyebrow{font-size:12px;line-height:16px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:#69727e}.status{font-size:20px;line-height:24px;font-weight:700;letter-spacing:-.3px}.warn .status{color:var(--tone)}.trend{display:flex;align-items:center;gap:7px;margin-top:2px}.pill{padding:4px 9px;display:flex;align-items:center;gap:4px;border:.5px solid var(--trend);color:var(--trend);background:var(--trend-bg);border-radius:999px;font-size:11px;line-height:16px;font-weight:700}.caption{font-size:14px;line-height:20px;font-weight:500;color:#69727e}.divider{height:.5px;background:#262e39;opacity:.7}.events{display:flex;flex-direction:column;gap:12px}.section-label{display:flex;align-items:center;justify-content:space-between;gap:8px}.rows{display:flex;flex-direction:column;gap:13px}.row{display:flex;align-items:center;gap:8px}.icon{display:grid;place-items:center;width:30px;height:30px;flex:none;border-radius:12px;background:var(--event-bg);color:var(--event)}.event-main{flex:1;display:flex;flex-direction:column;gap:5px}.event-top{display:flex;align-items:center;justify-content:space-between;gap:8px}.event-name{font-size:14px;line-height:20px;font-weight:500;color:#abb3bf}.value{font-size:15px;line-height:24px;font-weight:700;color:var(--value);font-variant-numeric:tabular-nums;white-space:nowrap}.unit{font-size:10px;line-height:14px;font-weight:600;color:#69727e;margin-left:3px}.track{width:100%;height:6px;border-radius:6px;background:#1d2530;overflow:hidden}.fill{height:100%;border-radius:6px;background:var(--event)}footer{margin-top:22px}svg{display:block}
</style></head><body><main><header><small>FOM · PESTAÑA PERFIL · ÍCONO DE LA PERSONA</small><h1>La tarjeta del índice de manejo</h1><p>Reproducción del componente actualizado de la app · Datos de ejemplo</p></header><div class="cards" id="cards"></div><footer>Anillo, variación semanal y barras de eventos. En amarillo y rojo aparecen el borde y el fondo de aviso.</footer></main><script>
const trendIcon='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8M17 7h4v4"/></svg>';
const icons=['<path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 12l4-3M12 12h.01"/>','<circle cx="10.5" cy="12" r="7.5"/><circle cx="10.5" cy="12" r="2.8"/><path d="M17.5 8.5h2.6a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1h-2.6"/>','<path d="M13 2 4 14h7l-1 8 10-12h-7l1-8z"/>'];
const labels=['Excesos de velocidad','Frenadas bruscas','Aceleraciones bruscas'];
const states=[{score:94,color:'#3DD68C',label:'Manejo seguro',delta:4,events:[0.2,0.1,0.3]},{score:76,color:'#F5C242',label:'Puedes mejorar',delta:-3,events:[1.6,0.8,1.1]},{score:48,color:'#FF6369',label:'Requiere atención',delta:-8,events:[2.8,2.2,1.7]}];
const rows=s=>s.events.map((v,i)=>{const c=v>=2?'#FF6369':v>=1?'#F5C242':'#69727E';const bg=v>=2?'#2A1416':v>=1?'#2A2410':'#0F141B';return `<div class="row" style="--event:${c};--event-bg:${bg};--value:${v>=1?c:'#ABB3BF'}"><div class="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${icons[i]}</svg></div><div class="event-main"><div class="event-top"><span class="event-name">${labels[i]}</span><span class="value">${v.toFixed(1)}<span class="unit">/100km</span></span></div><div class="track"><div class="fill" style="width:${Math.max(.04,Math.min(1,v/3))*100}%"></div></div></div></div>`}).join('');
document.getElementById('cards').innerHTML=states.map(s=>`<section class="card ${s.score<85?'warn':''}" style="--tone:${s.color};--halo:${s.color}1A;--trend:${s.delta>0?'#3DD68C':'#FF6369'};--trend-bg:${s.delta>0?'#13281D':'#2A1416'}"><div class="hero"><div class="ring"><svg width="112" height="112" viewBox="0 0 112 112"><circle cx="56" cy="56" r="51" stroke="#0F141B" stroke-width="10" fill="none"/><circle cx="56" cy="56" r="51" stroke="${s.color}" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="${102*Math.PI}" stroke-dashoffset="${102*Math.PI*(1-s.score/100)}" transform="rotate(-90 56 56)"/></svg><div class="number"><strong>${s.score}</strong><span>/ 100</span></div></div><div class="verdict"><div class="eyebrow">Índice de manejo</div><div class="status">${s.label}</div><div class="trend"><span class="pill">${trendIcon}${s.delta>0?'+':''}${s.delta}</span><span class="caption">vs. semana pasada</span></div></div></div><div class="divider"></div><div class="events"><div class="section-label"><span class="eyebrow">Eventos por 100 km</span><span class="caption">últimos 30 días</span></div><div class="rows">${rows(s)}</div></div></section>`).join('');
</script></body></html>
