<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FOM · Propuesta frente a implementación</title><style>*{box-sizing:border-box}body{margin:0;background:#080f17;color:#e8f0f9;font:16px/1.4 system-ui}header{padding:16px 24px;border-bottom:1px solid #36506b}h1{font-size:22px;margin:0 0 8px}p{margin:8px 0;color:#b6c7d7}select{padding:10px;background:#142536;color:white;border:1px solid #557086;font:inherit}main{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}h2{font-size:18px;margin:8px}.pane{height:calc(100vh - 200px);overflow:auto;border:1px solid #36506b}.pane img{width:100%;height:auto;display:block}a{color:#76c0ff}@media(max-width:650px){main{grid-template-columns:1fr}.pane{height:70vh}}</style><header><h1>Propuesta aprobada / web implementada</h1><p>Comparación de páginas completas. El hero de Inicio queda fuera de las correcciones. Cada columna se desplaza por separado.</p><label>Página <select id="pages"><option value="inicio" >Inicio · comparar desde debajo del hero</option><option value="plataforma" >Plataforma web</option><option value="app" selected>App</option><option value="funciones" >Funciones</option><option value="seguridad" >Seguridad</option><option value="areas" >Áreas</option><option value="quienes-somos" >Quiénes somos</option><option value="que-ofrecemos" >Qué ofrecemos</option><option value="beneficios" >Beneficios</option><option value="preguntas-frecuentes" >Preguntas</option><option value="contacto" >Contacto</option></select></label> · <a href="auditoria.md">Diagnóstico de las 11 páginas</a></header><main><section><h2>Propuesta aprobada</h2><div class="pane"><img id="proposal" src="../rediseno-completo-v6/03-app.png" alt="Propuesta aprobada completa"></div></section><section><h2>Web implementada · captura actual</h2><div class="pane"><img id="actual" src="resto-app.png" alt="Captura completa de la web implementada"></div></section></main><script>const pages=[["inicio","01-inicio","Inicio · comparar desde debajo del hero"],["plataforma","02-plataforma","Plataforma web"],["app","03-app","App"],["funciones","04-funciones","Funciones"],["seguridad","05-seguridad","Seguridad"],["areas","06-areas","Áreas"],["quienes-somos","07-quienes-somos","Quiénes somos"],["que-ofrecemos","08-que-ofrecemos","Qué ofrecemos"],["beneficios","09-beneficios","Beneficios"],["preguntas-frecuentes","10-preguntas","Preguntas"],["contacto","11-contacto","Contacto"]];document.querySelector('#pages').onchange=e=>{const p=pages.find(p=>p[0]===e.target.value);document.querySelector('#proposal').src='../rediseno-completo-v6/'+p[1]+'.png';document.querySelector('#actual').src='resto-'+p[0]+'.png';document.querySelectorAll('.pane').forEach(p=>p.scrollTop=0)}</script></html>
